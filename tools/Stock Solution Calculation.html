<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemistry Calculator</title>
  <style>
    @font-face { font-family: "Gochi Hand"; src: url("../fonts/GochiHand-Regular.ttf") format("truetype"); font-display: swap; }
    :root {
      color-scheme: light;
      --ink: #29332f;
      --muted: #68756e;
      --line: #dfe5df;
      --paper: #fffefa;
      --canvas: #f4f7f2;
      --sage: #dfe9dc;
      --sage-dark: #56715f;
      --blue: #e5edf1;
      --blue-dark: #4e6871;
      --danger: #9d4d47;
      --danger-bg: #f8e9e7;
      --shadow: 0 12px 32px rgba(41, 51, 47, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 20px 64px;
      color: var(--ink);
      background: var(--canvas);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    .container { width: min(760px, 100%); margin: 0 auto; }
    .calculator-header { margin-bottom: 20px; }
    .tabs { display: flex; gap: 8px; margin: 24px 0 14px; border-bottom: 1px solid var(--line); }
    .tab { padding: 10px 14px; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; }
    .tab.active { color: var(--sage-dark); border-bottom-color: var(--sage-dark); }
    .tab-panel[hidden] { display: none; }
    .measurement-group-picker { position: relative; min-width: 142px; }
    .measurement-group-picker summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 34px; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font: inherit; cursor: pointer; list-style: none; }
    .measurement-group-picker summary::-webkit-details-marker { display: none; }
    .measurement-group-picker summary:hover, .measurement-group-picker[open] summary { border-color: var(--sage-dark); background: var(--sage); }
    .measurement-group-chevron { width: 8px; height: 8px; flex: 0 0 auto; margin: -4px 2px 0 0; border-right: 1.5px solid var(--sage-dark); border-bottom: 1.5px solid var(--sage-dark); transform: rotate(45deg); }
    .measurement-group-menu { position: absolute; z-index: 20; top: calc(100% + 5px); left: 0; min-width: 100%; box-sizing: border-box; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: 0 8px 22px rgba(54,62,52,.14); }
    .measurement-group-menu button { display: block; width: 100%; padding: 8px 9px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); font: inherit; font-size: 12px; text-align: left; cursor: pointer; white-space: nowrap; }
    .measurement-group-menu button:hover { background: var(--sage); color: var(--ink); }
    .coming-soon { padding: 24px; border: 1px dashed var(--line); border-radius: 13px; color: var(--muted); background: #f7faf6; }
    .back-link { display: inline-block; margin-bottom: 18px; color: var(--sage-dark); text-decoration: none; font-size: 13px; font-weight: 700; }
    .back-link:hover { text-decoration: underline; }
    .eyebrow { margin: 18px 0 4px; color: var(--sage-dark); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { display: flex; align-items: center; gap: 11px; margin: 0; font: 400 34px/1.15 "Gochi Hand", cursive; letter-spacing: .01em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: #fff; background: var(--sage-dark); font: 28px/1 system-ui, sans-serif; transform: rotate(-8deg); }
    p.desc { max-width: 620px; margin: 10px 0 0; color: var(--muted); }
    label { display: block; margin: 0 0 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { margin-top: 17px; }
    .field.full { grid-column: 1 / -1; }
    input, select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff; color: var(--ink); font: inherit; }
    input:focus, select:focus { border-color: var(--sage-dark); box-shadow: 0 0 0 3px rgba(86,113,95,.12); }
    .calculator-card { padding: 25px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    button { border: 1px solid transparent; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 700; transition: .18s ease; }
    button:hover { transform: translateY(-1px); }
    .action-row { display: flex; align-items: stretch; gap: 8px; margin-top: 23px; }
    .action-row > button { margin-top: 0; }
    .calculate-btn { flex: 1; padding: 12px 16px; color: var(--sage-dark); background: transparent; border-color: var(--sage-dark); }
    .calculate-btn:hover { background: var(--sage); }
    .icon-btn { width: 44px; flex: 0 0 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); background: transparent; border-color: var(--line); }
    .icon-btn:hover { color: var(--ink); background: var(--sage); border-color: var(--sage-dark); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .formula-icon { font-size: 18px; }
    .backup-status, .small { margin-top: 9px; color: var(--muted); font-size: 12px; }
    .result { margin-top: 20px; padding: 16px 17px; border: 1px solid #c9d9cb; border-radius: 13px; background: var(--sage); line-height: 1.8; }
    .result strong { color: var(--sage-dark); }
    .error { margin-top: 20px; padding: 13px 15px; border-radius: 12px; color: var(--danger); background: var(--danger-bg); }
    .history { margin-top: 30px; padding-top: 23px; border-top: 1px solid var(--line); }
    .history h2 { margin: 0 0 15px; font: 400 25px/1.2 "Gochi Hand", cursive; }
    .record { margin-bottom: 10px; padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
    .record-title { margin-bottom: 7px; color: var(--sage-dark); font-weight: 800; }
    .record-row { margin: 3px 0; color: var(--muted); font-size: 13px; }
    .record-actions { margin-top: 11px; }
    .delete-btn, .secondary-btn { padding: 8px 12px; color: var(--muted); background: transparent; border-color: var(--line); font-size: 12px; }
    .delete-btn:hover, .secondary-btn:hover { color: var(--ink); background: var(--sage); border-color: var(--sage-dark); }
    .delete-btn { color: var(--danger); }
    .history > .secondary-btn { margin-top: 12px; }
    .empty { padding: 14px; border-radius: 11px; color: var(--muted); background: #f7faf6; }
    .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(37,48,43,.3); z-index: 10; }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(440px, 100%); padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: 0 25px 70px rgba(20,30,24,.2); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .modal-header h2 { margin: 0; font: 400 25px/1.2 "Gochi Hand", cursive; }
    .close-btn { width: auto; margin: 0; padding: 2px 8px; color: var(--muted); background: transparent; border: 0; font-size: 23px; font-weight: 400; }
    .close-btn:hover { color: var(--ink); background: var(--sage); }
    .formula { padding: 15px; border-radius: 12px; color: var(--muted); background: #f7faf6; line-height: 1.9; }
    @media (max-width: 600px) {
      body { padding: 24px 14px 48px; }
      .calculator-card { padding: 19px; }
      h1 { font-size: 30px; }
      .field-grid { grid-template-columns: 1fr; gap: 0; }
      .field.full { grid-column: auto; }
      .action-row { flex-wrap: wrap; }
      .calculate-btn { flex-basis: 100%; }
      .icon-btn { flex: 1; height: 42px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="calculator-header">
      <a class="back-link" href="../index.html">← Back to LabFlow</a>
      <h1><span class="brand-mark" aria-hidden="true">⌁</span>Chemistry Calculator</h1>
    </header>

    <div class="tabs" role="tablist" aria-label="Calculator type">
      <button class="tab active" id="wtTab" type="button" role="tab" aria-selected="true" aria-controls="wtPanel">wt% solution</button>
      <button class="tab" id="commonTab" type="button" role="tab" aria-selected="false" aria-controls="commonPanel">Common solution</button>
    </div>

    <main class="calculator-card">
      <section class="tab-panel" id="wtPanel" role="tabpanel" aria-labelledby="wtTab">
      <div class="field-grid">
        <div class="field full"><label for="sampleName">Sample name</label><input type="text" id="sampleName" /></div>
        <div class="field"><label for="solute">Solute mass x (g)</label><input type="text" id="solute" inputmode="decimal" autocomplete="off" /></div>
        <div class="field"><label for="wtpercent">Target concentration y (wt%)</label><input type="text" id="wtpercent" inputmode="decimal" autocomplete="off" /></div>
        <div class="field"><label for="solventName">Solvent</label><input type="text" id="solventName" list="commonSolvents" autocomplete="off" /></div>
        <div class="field"><label for="notes">Notes <span class="small">· optional</span></label><input type="text" id="notes" placeholder="Optional notes" /></div>
      </div>
      <datalist id="commonSolvents">
        <option value="DMAc"></option><option value="DMSO"></option><option value="CHCl3"></option><option value="MeCN"></option><option value="THF"></option>
      </datalist>

    <div class="action-row">
      <button class="calculate-btn" onclick="calculate()">Calculate & Save</button>
      <button class="icon-btn" onclick="exportBackup()" aria-label="Export JSON" title="Export JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6m0 0 4 4m-4-4-4 4M5 21h14" /></svg></button>
      <button class="icon-btn" onclick="prepareImport()" aria-label="Import JSON" title="Import JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12m0 0 4-4m-4 4-4-4M5 21h14" /></svg></button>
      <button class="icon-btn formula-icon" onclick="showFormula()" aria-label="Formula" title="Formula">Σ</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden onchange="importBackup(event)" />
    </div>
    <div class="backup-status" id="backupStatus">Last backup: Never</div>

    <div id="output"></div>

    <div class="history">
      <h2>Saved Records</h2>
      <div id="historyList"></div>
      <button class="secondary-btn" onclick="clearAllRecords()">Clear All Records</button>
    </div>
      </section>

      <section class="tab-panel" id="commonPanel" role="tabpanel" aria-labelledby="commonTab" hidden>
        <div class="field-grid">
          <div class="field full"><label for="commonChemicalPicker">Chemical</label><details class="measurement-group-picker" id="commonChemicalPicker"><summary><span id="commonChemicalLabel">Sodium chloride (NaCl)</span><span class="measurement-group-chevron" aria-hidden="true"></span></summary><div class="measurement-group-menu" role="menu"><button type="button" data-common-chemical-option="NaCl">Sodium chloride (NaCl)</button><button type="button" data-common-chemical-option="NaOH">Sodium hydroxide (NaOH)</button><button type="button" data-common-chemical-option="NaNO3">Sodium nitrate (NaNO<sub>3</sub>)</button><button type="button" data-common-chemical-option="Na2CO3">Sodium carbonate (Na<sub>2</sub>CO<sub>3</sub>)</button><button type="button" data-common-chemical-option="HCl">Hydrochloric acid (HCl)</button><button type="button" data-common-chemical-option="H2SO4">Sulfuric acid (H<sub>2</sub>SO<sub>4</sub>)</button></div><input type="hidden" id="commonChemical" value="NaCl"></details></div>
          <div class="field"><label for="commonMolarity">Target concentration (M)</label><input type="text" id="commonMolarity" inputmode="decimal" autocomplete="off"></div>
          <div class="field"><label for="commonVolume">Final volume (mL)</label><input type="text" id="commonVolume" inputmode="decimal" autocomplete="off"></div>
        </div>
        <div class="action-row">
          <button class="calculate-btn" type="button" onclick="calculateCommonSolution()">Calculate</button>
        </div>
        <div id="commonOutput"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="formulaModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="formulaTitle">
      <div class="modal-header"><h2 id="formulaTitle">Formula</h2><button class="close-btn" type="button" data-close-formula aria-label="Close">×</button></div>
      <div class="formula">
        <div><strong>Total mass = x × 100 / y</strong></div>
        <div>Solvent to add = Total mass - x</div>
        <div class="small">wt% = (solute mass / total mass) × 100%</div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "wt_solution_records";
    const LAST_BACKUP_KEY = "wt_solution_last_backup";
    const BACKUP_VERSION = 1;

    function getRecords() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        const parsed = data ? JSON.parse(data) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function formatTime(timestamp) {
      const d = new Date(timestamp);
      return d.toLocaleString();
    }

    function renderRecords() {
      const historyList = document.getElementById("historyList");
      const records = getRecords();

      if (records.length === 0) {
        historyList.innerHTML = '<div class="empty">No saved records yet.</div>';
        return;
      }

      historyList.innerHTML = records
        .map((record, index) => `
          <div class="record">
            <div class="record-title">${escapeHtml(record.sampleName || "Unnamed Sample")}</div>
            <div class="record-row"><strong>Solute:</strong> ${record.solute.toFixed(4)} g</div>
            <div class="record-row"><strong>Solvent:</strong> ${escapeHtml(record.solventName || "Unnamed solvent")} · ${record.solvent.toFixed(4)} g</div>
            <div class="record-row"><strong>Total mass:</strong> ${record.totalMass.toFixed(4)} g</div>
            <div class="record-row"><strong>wt%:</strong> ${record.wt.toFixed(4)} %</div>
            ${record.notes ? `<div class="record-row"><strong>Notes:</strong> ${escapeHtml(record.notes)}</div>` : ""}
            <div class="record-row"><strong>Saved:</strong> ${formatTime(record.timestamp)}</div>
            <div class="record-actions">
              <button class="delete-btn" onclick="deleteRecord(${index})">Delete</button>
            </div>
          </div>
        `)
        .reverse()
        .join("");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }

    function calculate() {
      const sampleName = document.getElementById("sampleName").value.trim();
      const solventName = document.getElementById("solventName").value.trim();
      const notes = document.getElementById("notes").value.trim();
      const solute = parseFloat(document.getElementById("solute").value);
      const wt = parseFloat(document.getElementById("wtpercent").value);
      const output = document.getElementById("output");

      output.innerHTML = "";

      if (!sampleName) {
        output.innerHTML = '<div class="error">Please enter a sample name.</div>';
        return;
      }

      if (isNaN(solute) || isNaN(wt)) {
        output.innerHTML = '<div class="error">Please enter complete numeric values.</div>';
        return;
      }

      if (solute <= 0) {
        output.innerHTML = '<div class="error">Solute mass must be greater than 0.</div>';
        return;
      }

      if (wt <= 0 || wt >= 100) {
        output.innerHTML = '<div class="error">wt% must be greater than 0 and less than 100.</div>';
        return;
      }

      const totalMass = solute * 100 / wt;
      const solvent = totalMass - solute;

      const newRecord = {
        sampleName,
        solventName,
        notes,
        solute,
        solvent,
        totalMass,
        wt,
        timestamp: Date.now()
      };

      const records = getRecords();
      records.push(newRecord);
      saveRecords(records);

      output.innerHTML = `
        <div class="result">
          <div><strong>Sample Name:</strong> ${escapeHtml(sampleName)}</div>
          <div><strong>Final total mass:</strong> ${totalMass.toFixed(4)} g</div>
          <div><strong>Solvent to add:</strong> ${solvent.toFixed(4)} g</div>
          <div><strong>Saved to browser successfully.</strong></div>
        </div>
      `;

      renderRecords();
    }

    function calculateCommonSolution() {
      const data = {
        NaCl: { type: "solid", molarMass: 58.44, display: "Sodium chloride (NaCl)" },
        NaOH: { type: "solid", molarMass: 40.00, display: "Sodium hydroxide (NaOH)" },
        NaNO3: { type: "solid", molarMass: 85.00, display: "Sodium nitrate (NaNO3)" },
        Na2CO3: { type: "solid", molarMass: 105.99, display: "Sodium carbonate (Na2CO3)" },
        HCl: { type: "liquid", molarMass: 36.46, wtFraction: 0.37, density: 1.19, display: "Hydrochloric acid (HCl)" },
        H2SO4: { type: "liquid", molarMass: 98.08, wtFraction: 0.98, density: 1.84, display: "Sulfuric acid (H2SO4)" },
      };
      const chemical = document.getElementById("commonChemical").value;
      const molarity = parseFloat(document.getElementById("commonMolarity").value);
      const volumeMl = parseFloat(document.getElementById("commonVolume").value);
      const output = document.getElementById("commonOutput");
      const reagent = data[chemical];
      output.innerHTML = "";
      if (!Number.isFinite(molarity) || !Number.isFinite(volumeMl) || molarity <= 0 || volumeMl <= 0) {
        output.innerHTML = "<div class=\"error\">Please enter positive numeric values for concentration and volume.</div>";
        return;
      }
      const volumeL = volumeMl / 1000;
      if (reagent.type === "solid") {
        const mass = molarity * volumeL * reagent.molarMass;
        output.innerHTML = "<div class=\"result\"><div><strong>" + reagent.display + "</strong></div><div>Weigh: <strong>" + mass.toFixed(4) + " g</strong></div><div>Add solvent to a final volume of <strong>" + volumeMl.toFixed(2) + " mL</strong>.</div></div>";
        return;
      }
      const stockMolarity = reagent.density * 1000 * reagent.wtFraction / reagent.molarMass;
      const stockVolumeMl = molarity * volumeL / stockMolarity * 1000;
      output.innerHTML = "<div class=\"result\"><div><strong>" + reagent.display + "</strong> stock assumption: " + (reagent.wtFraction * 100) + "% · " + reagent.density.toFixed(2) + " g/mL</div><div>Measure: <strong>" + stockVolumeMl.toFixed(4) + " mL</strong> stock solution</div><div><strong>Preparation</strong></div><div>1. Add water to a suitable vessel first.</div><div>2. Slowly add the acid stock while mixing.</div><div>3. Allow the solution to cool to room temperature.</div><div>4. Add water to a final volume of <strong>" + volumeMl.toFixed(2) + " mL</strong>.</div><div class=\"small\">Always add acid to water, never water to acid.</div></div>";
    }

    function deleteRecord(index) {
      const records = getRecords();
      records.splice(index, 1);
      saveRecords(records);
      renderRecords();
    }

    function backupFilename() {
      const date = new Date().toISOString().slice(0, 10);
      return `stock-solution-backup-v${BACKUP_VERSION}-${date}.json`;
    }

    function updateBackupStatus(timestamp) {
      const status = document.getElementById("backupStatus");
      if (status) status.textContent = timestamp ? `Last backup: ${formatTime(timestamp)}` : "Last backup: Never";
    }

    function exportBackup(showMessage = true) {
      const exportedAt = Date.now();
      const payload = {
        format: "Stock Solution Calculation backup",
        version: BACKUP_VERSION,
        exportedAt,
        records: getRecords()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = backupFilename();
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      localStorage.setItem(LAST_BACKUP_KEY, String(exportedAt));
      updateBackupStatus(exportedAt);
      if (showMessage) document.getElementById("output").innerHTML = '<div class="result">Backup exported successfully.</div>';
    }

    function prepareImport() {
      exportBackup(false);
      document.getElementById("importFile").click();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          const records = Array.isArray(payload) ? payload : payload.records;
          if (!Array.isArray(records)) throw new Error("Invalid backup format.");
          if (!records.every(record => record && typeof record.sampleName === "string" && Number.isFinite(Number(record.solute)) && Number.isFinite(Number(record.wt)))) {
            throw new Error("Backup contains invalid records.");
          }
          if (!confirm(`Import ${records.length} saved record(s)? This will replace current records.`)) return;
          saveRecords(records);
          renderRecords();
          document.getElementById("output").innerHTML = '<div class="result">Backup imported successfully.</div>';
        } catch (error) {
          document.getElementById("output").innerHTML = `<div class="error">${escapeHtml(error.message || "Could not import backup.")}</div>`;
        }
      };
      reader.readAsText(file);
    }

    function showFormula() {
      document.getElementById("formulaModal").hidden = false;
    }

    function closeFormula() {
      document.getElementById("formulaModal").hidden = true;
    }

    document.querySelector('[data-close-formula]').addEventListener("click", closeFormula);
    document.getElementById("formulaModal").addEventListener("click", event => {
      if (event.target.id === "formulaModal") closeFormula();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeFormula();
    });

    function clearAllRecords() {
      if (confirm("Are you sure you want to delete all saved records?")) {
        localStorage.removeItem(STORAGE_KEY);
        renderRecords();
        document.getElementById("output").innerHTML = "";
      }
    }

    document.querySelectorAll("[data-common-chemical-option]").forEach(option => option.addEventListener("click", () => {
      document.getElementById("commonChemical").value = option.dataset.commonChemicalOption;
      document.getElementById("commonChemicalLabel").innerHTML = option.innerHTML;
      document.getElementById("commonChemicalPicker").open = false;
    }));

    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      const isWt = tab.id === "wtTab";
      document.querySelectorAll(".tab").forEach(item => { item.classList.toggle("active", item === tab); item.setAttribute("aria-selected", item === tab ? "true" : "false"); });
      document.getElementById("wtPanel").hidden = !isWt;
      document.getElementById("commonPanel").hidden = isWt;
    }));

    document.querySelectorAll("#wtPanel input, #commonPanel input").forEach(field => field.addEventListener("keydown", event => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      if (field.closest("#commonPanel")) calculateCommonSolution();
      else calculate();
    }));

    updateBackupStatus(localStorage.getItem(LAST_BACKUP_KEY));
    renderRecords();
  </script>
</body>
</html>
